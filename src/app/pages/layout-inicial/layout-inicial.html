<div class="main-container">
  <header class="header">
    <h1>Gestor de procesos</h1>
    <p>Documenta y organiza los flujos de trabajo de tu empresa en un solo lugar.</p>
    <hr class="divider">
  </header>

  <main class="card-container">
    <div class="card">
      <p class="instruction-text">
        ¿Primera vez? Registra tu empresa para comenzar. Luego podrás invitar usuarios a tu equipo.
      </p>
      
      <button class="btn-primary" (click)="navegarRegistro()">
        Registrar empresa
      </button>

      <p class="secondary-text">Ya tengo cuenta.</p>

      <button class="btn-primary" (click)="navegarLogin()">
        Iniciar Sesión
      </button>
    </div>
  </main>
</div>
