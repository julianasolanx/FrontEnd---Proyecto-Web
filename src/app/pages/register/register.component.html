<div class="register-wrapper">
  <div class="register-card">
    <h1>Registrarse</h1>
    <hr>

    <div class="alert alert-error" *ngIf="errorMsg">{{ errorMsg }}</div>
    <div class="alert alert-success" *ngIf="successMsg">{{ successMsg }}</div>

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm" novalidate>

      <div class="form-grid">

        <div class="form-group">
          <label for="nombre">Nombres:</label>
          <input
            type="text"
            id="nombre"
            name="nombre"
            [(ngModel)]="datos.nombre"
            placeholder="Ingrese su nombre"
            required />
        </div>

        <div class="form-group">
          <label for="correo">Correo electrónico:</label>
          <input
            type="email"
            id="correo"
            name="correo"
            [(ngModel)]="datos.correo"
            placeholder="Ingrese su correo electrónico"
            required />
        </div>

        <div class="form-group">
          <label for="rol">Rol:</label>
          <select id="rol" name="rol" [(ngModel)]="datos.rol" required>
            <option value="" disabled>Selecciona un rol</option>
            <option value="ADMINISTRADOR">Administrador</option>
            <option value="EDITOR">Editor</option>
            <option value="SOLO_LECTURA">Solo lectura</option>
          </select>
        </div>

        <div class="form-group">
          <label for="contrasena">Contraseña:</label>
          <input
            type="password"
            id="contrasena"
            name="contrasena"
            [(ngModel)]="datos.contrasena"
            placeholder="Ingrese una contraseña"
            required />
        </div>

      </div>

      <div class="form-footer-row">
        <p class="form-footer">
          ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
        </p>
        <button type="submit" class="btn-pill" [disabled]="loading">
          <span *ngIf="!loading">registrarse</span>
          <span *ngIf="loading">Creando cuenta...</span>
        </button>
      </div>

    </form>
  </div>
</div>

<footer>
  <div class="social-icons">
    <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook"></i></a>
    <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
    <a href="#" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
  </div>
  <div class="footer-logo">Procesos <span>empresariales</span></div>
</footer>
