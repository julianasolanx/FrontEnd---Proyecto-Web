<div class="page-container">
  <button class="back-arrow" (click)="volver()">⤺</button>

  <div class="login-card">
    <h1>Iniciar Sesión</h1>
    <hr class="divider">

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="input-group">
        <label>Correo Electrónico:</label>
        <input type="email" formControlName="correo" placeholder="Ingrese su correo electrónico">
      </div>

      <div class="input-group">
        <label>Contraseña:</label>
        <input type="password" formControlName="contrasena" placeholder="Ingrese su contraseña">
      </div>

      <div class="actions">
        <button type="submit" class="btn-main">
          iniciar sesión
        </button>
      </div>
    </form>
  </div>
</div>
