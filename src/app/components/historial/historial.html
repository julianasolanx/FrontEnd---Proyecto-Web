<div class="historial-section">

  <div class="section-header">
    <h5>Historial de cambios</h5>
  </div>

  <div class="spinner-wrap" *ngIf="cargando">
    <div class="spinner"></div>
  </div>

  <div class="empty-state" *ngIf="!cargando && historial.length === 0">
    Sin cambios registrados todavía.
  </div>

  <div class="historial-list" *ngIf="!cargando && historial.length > 0">
    <div class="historial-item" *ngFor="let h of historial">
      <div class="hist-dot"></div>
      <div class="hist-content">
        <div class="hist-header">
          <span class="hist-entidad">{{ h.entidad }}</span>
          <span class="hist-campo">{{ h.campo }}</span>
          <span class="hist-fecha">{{ h.fechaCambio | slice:0:16 }}</span>
        </div>
        <div class="hist-valores">
          <span class="val-antes" *ngIf="h.valorAnterior">{{ h.valorAnterior }}</span>
          <span class="flecha" *ngIf="h.valorAnterior">→</span>
          <span class="val-despues">{{ h.valorNuevo || '(vacío)' }}</span>
        </div>
      </div>
    </div>
  </div>

</div>
