<div class="editor-card">
  <h3>{{ esEdicion ? 'Editar proceso' : 'Nuevo proceso' }}</h3>

  <div class="alert-error" *ngIf="error">{{ error }}</div>

  <form (ngSubmit)="guardar()" novalidate>

    <div class="field">
      <label>Nombre *</label>
      <input type="text" [(ngModel)]="form.nombre" name="nombre"
             placeholder="Nombre del proceso" />
    </div>

    <div class="field">
      <label>Descripción</label>
      <textarea [(ngModel)]="form.descripcion" name="descripcion"
                rows="3" placeholder="Descripción del proceso"></textarea>
    </div>

    <div class="field-row">
      <div class="field">
        <label>Categoría</label>
        <input type="text" [(ngModel)]="form.categoria" name="categoria"
               placeholder="Ej: Operativo, Estratégico..." />
      </div>
      <div class="field">
        <label>Estado</label>
        <select [(ngModel)]="form.estado" name="estado">
          <option value="BORRADOR">Borrador</option>
          <option value="PUBLICADO">Publicado</option>
          <option value="INACTIVO">Inactivo</option>
        </select>
      </div>
    </div>

    <div class="editor-actions">
      <button type="button" class="btn-pill outline" (click)="cancelar()">Cancelar</button>
      <button type="submit" class="btn-pill" [disabled]="guardando">
        {{ guardando ? 'Guardando...' : (esEdicion ? 'Actualizar' : 'Crear proceso') }}
      </button>
    </div>

  </form>
</div>
