# ==================
# ConfigMap nginx
# Proxea /api al backend (Service "proyecto" en el mismo namespace)
# ==================
apiVersion: v1
kind: ConfigMap
metadata:
  name: mi-proyecto-nginx-conf
  namespace: grupo22
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location /api {
            resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;
            set $backend http://proyecto:8080;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_method $request_method;
            proxy_http_version 1.1;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

---
# ==================
# Deployment
# ==================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mi-proyecto-frontend
  namespace: grupo22
  labels:
    app: mi-proyecto-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mi-proyecto-frontend
  template:
    metadata:
      labels:
        app: mi-proyecto-frontend
    spec:
      containers:
        - name: mi-proyecto-frontend
          image: ghcr.io/julianasolanx/mi-proyecto-frontend:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-conf
          configMap:
            name: mi-proyecto-nginx-conf
      imagePullSecrets:
        - name: ghcr-secret

---
# ==================
# Service
# ==================
apiVersion: v1
kind: Service
metadata:
  name: mi-proyecto-frontend
  namespace: grupo22
  labels:
    app: mi-proyecto-frontend
spec:
  selector:
    app: mi-proyecto-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP

---
# ==================
# Ingress (todo el tráfico externo entra por el frontend)
# ==================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mi-proyecto-frontend
  namespace: grupo22
spec:
  ingressClassName: public
  rules:
    - host: grupo22.inphotech.co
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mi-proyecto-frontend
                port:
                  number: 80
